name: Video pilot tests
on:
  push:
    branches: ['feature/video-pilot']
    paths: ['video-pilot/**', '.github/workflows/video-pilot.yml']
  pull_request:
    paths: ['video-pilot/**', '.github/workflows/video-pilot.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r video-pilot/requirements.txt
      - run: python -m unittest discover -s video-pilot/tests -v
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python video-pilot/tests/render_smoke.py
