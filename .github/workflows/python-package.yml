name: Toolkit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q lib tools scripts tests
          sh -n install.sh
          sh -n scripts/bootstrap-cloud.sh
      - name: Run tests, including isolated full self-test
        run: python -m pytest -q tests
      - name: Install optional loopback SSH test dependency
        if: matrix.python-version == '3.12'
        run: python -m pip install -r requirements-integration.txt
      - name: Exercise real OpenSSH transport on loopback
        if: matrix.python-version == '3.12'
        env:
          ISH_TEST_SSH: '1'
        run: python -m pytest -q tests/test_compute_ssh.py
      - name: Build and verify independent Elmatrix deployment
        run: |
          sh -n install-elmatrix.sh
          python scripts/deploy_elmatrix.py --install --bin-dir "$RUNNER_TEMP/elmatrix-bin"
          "$RUNNER_TEMP/elmatrix-bin/elmatrix" --version
          "$RUNNER_TEMP/elmatrix-bin/elmatrix" providers
          (cd dist/elmatrix && sha256sum --check SHA256SUMS)
      - name: Publish standalone deployment bundle
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: elmatrix-${{ github.sha }}
          path: |
            dist/elmatrix/elmatrix.pyz
            dist/elmatrix/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
