name: Elmatrix standalone tests

on:
  push:
    branches: [main, "elmatrix/**"]
    paths:
      - "elmatrix-standalone/**"
      - ".github/workflows/elmatrix-standalone.yml"
  pull_request:
    paths:
      - "elmatrix-standalone/**"
      - ".github/workflows/elmatrix-standalone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: elmatrix-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without runtime dependencies
        run: python -m pip install --no-deps .
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI
        run: |
          export ELMATRIX_HOME="$RUNNER_TEMP/elmatrix-test-home"
          elmatrix init
          elmatrix niches > "$RUNNER_TEMP/niches.json"
          elmatrix report > "$RUNNER_TEMP/report.json"
          python -c "import json; assert len(json.load(open('$RUNNER_TEMP/niches.json'))) >= 22"
          python -c "assert len(json.load(open('$RUNNER_TEMP/report.json'))['results']) >= 22"
